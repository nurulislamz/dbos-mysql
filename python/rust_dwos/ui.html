<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>rust-dwos workflows</title>
<style>
:root {
  color-scheme: light dark;
  --ground: #f3f1ec;
  --surface: #fffcf7;
  --ink: #1a1916;
  --muted: #5e5a53;
  --line: #e3dfd6;
  --line-strong: #c9c3b6;
  --accent: #0e5c56;
  --accent-ink: #f4fffd;
  --focus: #0e5c56;
  --pending-bg: #dcebf5; --pending-ink: #0f4566;
  --success-bg: #dcefe0; --success-ink: #17542a;
  --error-bg: #f8dfdc; --error-ink: #8a1f16;
  --limit-bg: #f6e8c6; --limit-ink: #66470a;
  --cancel-bg: #ecece7; --cancel-ink: #3f413c;
  --shadow: 0 1px 0 rgba(26, 25, 22, 0.04);
}
@media (prefers-color-scheme: dark) {
  :root {
    --ground: #121311;
    --surface: #1c1d1a;
    --ink: #f4f1ea;
    --muted: #a8a296;
    --line: #2f312c;
    --line-strong: #4a4c45;
    --accent: #8fd0c6;
    --accent-ink: #10211f;
    --focus: #8fd0c6;
    --pending-bg: #17364a; --pending-ink: #b7dcf3;
    --success-bg: #173a22; --success-ink: #b5e5c3;
    --error-bg: #4a1f1b; --error-ink: #f9c6c0;
    --limit-bg: #453410; --limit-ink: #f3dc9f;
    --cancel-bg: #2a2b28; --cancel-ink: #c8cbc3;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-variant-numeric: tabular-nums;
}
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.top {
  display: flex;
  align-items: center;
  gap: 16px;
  height: 56px;
  padding: 0 20px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
  position: sticky;
  top: 0;
  z-index: 2;
}
.brand {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-family: Palatino, "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  font-size: 20px;
  letter-spacing: -0.02em;
}
.brand small { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.search { flex: 1; max-width: 420px; position: relative; }
.search input {
  width: 100%;
  height: 36px;
  padding: 0 12px 0 32px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  background: var(--ground);
  color: var(--ink);
  font: inherit;
}
.search svg { position: absolute; left: 10px; top: 10px; color: var(--muted); }
.tools { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.stamp { color: var(--muted); font-size: 13px; }
button {
  font: inherit;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  min-height: 36px;
  padding: 0 12px;
  cursor: pointer;
}
button:hover { border-color: var(--ink); }
button:active { transform: translateY(1px); }
button[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
.shell { max-width: 1280px; margin: 0 auto; padding: 20px 20px 48px; }
h1 {
  font-family: Palatino, "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  font-size: 32px;
  font-weight: 500;
  letter-spacing: -0.03em;
  line-height: 1.15;
  margin: 0;
  overflow-wrap: anywhere;
}
h1:focus { outline: none; }
h2 { font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 28px 0 8px; }
.finding { margin: 8px 0 16px; color: var(--muted); }
.layout { display: grid; grid-template-columns: 200px 1fr; gap: 16px; align-items: start; }
.filters { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 76px; }
.filters button { display: flex; justify-content: space-between; text-align: left; background: transparent; border-color: transparent; }
.filters button:hover { background: var(--surface); border-color: var(--line); }
.filters button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.count { font-variant-numeric: tabular-nums; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
table { width: 100%; border-collapse: collapse; }
caption { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
th { text-align: left; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
th, td { padding: 10px 14px; vertical-align: top; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: color-mix(in srgb, var(--accent) 7%, transparent); }
tbody td { border-top: 1px solid var(--line); }
.id { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; font-weight: 550; overflow-wrap: anywhere; }
.name { overflow-wrap: anywhere; }
.sub { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.when { color: var(--muted); white-space: nowrap; font-size: 13px; }
.message { color: var(--muted); padding: 20px 14px; margin: 0; }
.alert { background: var(--error-bg); color: var(--error-ink); border-radius: 8px; padding: 8px 12px; margin: 0 0 12px; }
.alert:empty { display: none; }
.chip {
  display: inline-block;
  border-radius: 999px;
  padding: 2px 8px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.02em;
  white-space: nowrap;
}
.chip-PENDING { background: var(--pending-bg); color: var(--pending-ink); }
.chip-SUCCESS { background: var(--success-bg); color: var(--success-ink); }
.chip-ERROR { background: var(--error-bg); color: var(--error-ink); }
.chip-MAX_RECOVERY_ATTEMPTS_EXCEEDED { background: var(--limit-bg); color: var(--limit-ink); }
.chip-CANCELLED { background: var(--cancel-bg); color: var(--cancel-ink); }
.back { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 12px; font-size: 13px; }
.head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 8px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px 20px; margin: 0; padding: 16px; }
.facts dt { color: var(--muted); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; }
.facts dd { margin: 2px 0 0; overflow-wrap: anywhere; }
pre {
  margin: 0;
  padding: 12px 14px;
  max-height: 320px;
  overflow: auto;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  background: var(--ground);
}
.timeline { list-style: none; margin: 0; padding: 8px 0; }
.timeline li { display: grid; grid-template-columns: 28px 1fr; }
.rail { position: relative; }
.rail::before {
  content: "";
  position: absolute;
  left: 13px;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--line-strong);
}
.timeline li:first-child .rail::before { top: 18px; }
.timeline li:last-child .rail::before { bottom: auto; height: 18px; }
.dot {
  position: absolute;
  left: 8px;
  top: 16px;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: var(--surface);
  border: 2px solid var(--accent);
}
.step { padding: 8px 14px 16px 0; }
.step-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; }
.step-id { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; color: var(--muted); }
.step-name { font-weight: 600; overflow-wrap: anywhere; }
.step-kind, .step-time { color: var(--muted); font-size: 13px; }
.step pre { margin-top: 8px; border-radius: 8px; }
.note { color: var(--muted); font-size: 13px; margin: 24px 0 0; }
@media (max-width: 800px) {
  .top { height: auto; flex-wrap: wrap; padding: 12px 16px; }
  .search { order: 3; max-width: none; flex-basis: 100%; }
  .layout { grid-template-columns: 1fr; }
  .filters { position: static; flex-direction: row; flex-wrap: wrap; }
  .shell { padding: 16px 16px 32px; }
  thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  table, tbody, tr, td { display: block; }
  tbody tr { padding: 12px 14px; border-top: 1px solid var(--line); }
  tbody td { border: 0; padding: 2px 0; }
  td[data-label]::before { content: attr(data-label) ": "; color: var(--muted); }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">rust-dwos <small>read only</small></div>
  <label class="search">
    <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5 L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <input id="query" type="search" placeholder="Filter by id or name" autocomplete="off" spellcheck="false" aria-label="Filter workflows by id or name">
  </label>
  <div class="tools">
    <span class="stamp" id="stamp" role="status"></span>
    <button type="button" id="pause" aria-pressed="false">Pause</button>
  </div>
</header>
<div class="shell">
  <main id="view"></main>
</div>
<script>
"use strict";
const REFRESH_MS = 5000;
const LABELS = {
  PENDING: "Pending",
  SUCCESS: "Succeeded",
  ERROR: "Failed",
  MAX_RECOVERY_ATTEMPTS_EXCEEDED: "Recovery limit",
  CANCELLED: "Cancelled",
};
const view = document.getElementById("view");
const stamp = document.getElementById("stamp");
const pauseButton = document.getElementById("pause");
const query = document.getElementById("query");
let paused = false;
let filter = "ALL";
let timer = null;
let navigation = 0;
let shown = null;

function el(tag, attributes, ...children) {
  const node = document.createElement(tag);
  for (const [name, value] of Object.entries(attributes || {})) {
    if (value !== null && value !== undefined) node.setAttribute(name, value);
  }
  node.append(...children.filter((child) => child !== null && child !== undefined));
  return node;
}

function label(status) { return LABELS[status] || status; }
function chip(status) { return el("span", { class: `chip chip-${status}` }, label(status)); }
function workflowHref(id) { return `#/workflows/${encodeURIComponent(id)}`; }
function blank(value) { return value === null || value === undefined || value === "" ? "—" : value; }

function when(ms) {
  if (ms === null || ms === undefined) return "—";
  const date = new Date(ms);
  return el("time", { datetime: date.toISOString() }, date.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "medium" }));
}

function span(start, end) {
  if (start === null || start === undefined || end === null || end === undefined || end < start) return "";
  const seconds = Math.round((end - start) / 1000);
  if (seconds < 1) return "under 1s";
  if (seconds < 60) return `${seconds}s`;
  const minutes = Math.floor(seconds / 60);
  return `${minutes}m ${seconds % 60}s`;
}

async function getJson(path) {
  let response;
  try {
    response = await fetch(path, { headers: { Accept: "application/json" } });
  } catch {
    throw new Error("The viewer is not responding.");
  }
  let body = null;
  try { body = await response.json(); } catch { body = null; }
  if (!response.ok) {
    const error = new Error((body && body.error) || `The viewer answered with status ${response.status}.`);
    error.status = response.status;
    throw error;
  }
  return body;
}

function matchesQuery(row) {
  const needle = query.value.trim().toLowerCase();
  if (!needle) return true;
  return `${row.workflow_id} ${row.name} ${row.queue_name || ""}`.toLowerCase().includes(needle);
}

function finding(rows, visible) {
  if (rows.length === 0) return "No workflows yet.";
  const noun = visible === 1 ? "workflow" : "workflows";
  if (visible !== rows.length) return `Showing ${visible} of ${rows.length} ${rows.length === 1 ? "workflow" : "workflows"}.`;
  const failed = rows.filter((row) => row.status === "ERROR").length;
  const pending = rows.filter((row) => row.status === "PENDING").length;
  if (failed) return `${failed} failed, out of ${rows.length}.`;
  if (pending) return `${pending} of ${rows.length} still running.`;
  return rows.length === 1 ? "1 workflow, finished." : `${rows.length} workflows, all finished.`;
}

function filterButton(key, text, count) {
  const button = el("button", { type: "button", "aria-pressed": String(filter === key), "data-key": `filter:${key}` },
    el("span", null, text),
    el("span", { class: "count" }, String(count)),
  );
  button.addEventListener("click", () => {
    filter = key;
    if (shown) renderList(shown.rows, shown.problem);
  });
  return button;
}

function workflowRow(row) {
  const extra = [row.queue_name ? `Queue ${row.queue_name}` : "", row.schedule_name ? `Schedule ${row.schedule_name}` : ""].filter(Boolean).join(" · ");
  const tr = el("tr", { "data-key": `row:${row.workflow_id}` },
    el("td", { class: "id" }, el("a", { href: workflowHref(row.workflow_id), "data-key": `workflow:${row.workflow_id}` }, row.workflow_id)),
    el("td", { class: "state", "data-label": "Status" }, chip(row.status)),
    el("td", { class: "name", "data-label": "Name" }, row.name, extra ? el("span", { class: "sub" }, extra) : null),
    el("td", { class: "when", "data-label": "Started" }, when(row.created_at_ms)),
    el("td", { class: "when", "data-label": "Closed" }, row.completed_at_ms ? when(row.completed_at_ms) : el("span", null, "Running")),
  );
  tr.addEventListener("click", (event) => {
    if (event.target.closest("a")) return;
    location.hash = workflowHref(row.workflow_id);
  });
  return tr;
}

function renderList(rows, problem) {
  shown = { rows, problem };
  const queried = rows.filter(matchesQuery);
  const statuses = Object.keys(LABELS);
  const filtered = filter === "ALL" ? queried : queried.filter((row) => row.status === filter);
  const buttons = [filterButton("ALL", "All", queried.length)];
  for (const status of statuses) buttons.push(filterButton(status, label(status), queried.filter((row) => row.status === status).length));
  const empty = rows.length === 0
    ? "Workflows appear here once your program starts one."
    : "Nothing matches this filter.";
  const body = filtered.length ? el("tbody", null, ...filtered.map(workflowRow)) : null;
  swap(
    el("h1", { tabindex: "-1" }, "Workflows"),
    el("p", { class: "finding" }, finding(rows, filtered.length)),
    el("p", { class: "alert", role: "alert" }, problem || ""),
    el("div", { class: "layout" },
      el("div", { class: "filters", role: "group", "aria-label": "Filter by status" }, ...buttons),
      el("div", { class: "panel" },
        el("table", null,
          el("caption", null, "Workflows, newest first"),
          el("thead", null, el("tr", null,
            el("th", { scope: "col" }, "Workflow"),
            el("th", { scope: "col" }, "Status"),
            el("th", { scope: "col" }, "Name"),
            el("th", { scope: "col" }, "Started"),
            el("th", { scope: "col" }, "Closed"),
          )),
          body,
        ),
        filtered.length ? null : el("p", { class: "message" }, empty),
      ),
    ),
  );
}

function valueBlock(title, value, missing) {
  const content = value === null || value === undefined
    ? el("p", { class: "message" }, missing)
    : el("pre", { tabindex: "0", "aria-label": title }, value);
  return [el("h2", null, title), el("div", { class: "panel" }, content)];
}

function fact(name, value) {
  return el("div", null, el("dt", null, name), el("dd", null, value));
}

function stepItem(step) {
  let kind = "Output";
  if (step.error !== null) kind = "Error";
  else if (step.child_workflow_id !== null) kind = "Child";
  const value = step.error !== null ? step.error : step.output;
  const took = span(step.started_at_epoch_ms, step.completed_at_epoch_ms);
  return el("li", null,
    el("div", { class: "rail", "aria-hidden": "true" }, el("span", { class: "dot" })),
    el("div", { class: "step" },
      el("div", { class: "step-head" },
        el("span", { class: "step-id" }, String(step.step_id).padStart(2, "0")),
        el("span", { class: "step-name" }, step.step_name),
        el("span", { class: "step-kind" }, kind),
        took ? el("span", { class: "step-time" }, took) : null,
        step.child_workflow_id === null ? null : el("a", { href: workflowHref(step.child_workflow_id), "data-key": `child:${step.step_id}` }, step.child_workflow_id),
      ),
      value === null ? null : el("pre", { tabindex: "0", "aria-label": `Step ${step.step_id} value` }, value),
    ),
  );
}

function renderDetail(workflow, steps, problem) {
  const unfinished = workflow.status === "PENDING" ? "Not finished yet." : "None stored.";
  const outcome = workflow.error !== null
    ? valueBlock("Error", workflow.error, unfinished)
    : valueBlock("Output", workflow.output, unfinished);
  const ran = span(workflow.created_at_ms, workflow.completed_at_ms || Date.now());
  swap(
    el("a", { class: "back", href: "#/", "data-key": "back" }, "All workflows"),
    el("div", { class: "head" },
      el("h1", { tabindex: "-1" }, workflow.workflow_id),
      chip(workflow.status),
    ),
    el("p", { class: "finding" }, `${workflow.name}${ran ? ` · ${ran}` : ""}`),
    el("p", { class: "alert", role: "alert" }, problem || ""),
    el("dl", { class: "facts panel" },
      fact("Attempts", `${workflow.recovery_attempts} of ${workflow.max_recovery_attempts ?? "unlimited"}`),
      fact("Queue", blank(workflow.queue_name)),
      fact("Schedule", blank(workflow.schedule_name)),
      fact("Version", blank(workflow.application_version)),
      fact("Executor", blank(workflow.executor_id)),
      fact("Parent", workflow.parent_workflow_id === null ? "—" : el("a", { href: workflowHref(workflow.parent_workflow_id), "data-key": "parent" }, workflow.parent_workflow_id)),
      fact("Forked from", workflow.forked_from ? el("a", { href: workflowHref(workflow.forked_from), "data-key": "fork" }, workflow.forked_from) : "—"),
      fact("Started", when(workflow.created_at_ms)),
      fact("Updated", when(workflow.updated_at_ms)),
      fact("Closed", when(workflow.completed_at_ms)),
      fact("Deadline", when(workflow.workflow_deadline_epoch_ms)),
      fact("Format", blank(workflow.serialization)),
    ),
    ...outcome,
    ...valueBlock("Input", workflow.input, "None stored."),
    ...(workflow.attributes ? valueBlock("Attributes", workflow.attributes, "") : []),
    el("h2", null, `History · ${steps.length} ${steps.length === 1 ? "step" : "steps"}`),
    el("div", { class: "panel" }, steps.length
      ? el("ol", { class: "timeline" }, ...steps.map(stepItem))
      : el("p", { class: "message" }, "No steps saved yet.")),
    el("p", { class: "note" }, "Values are shown exactly as stored, without decoding. Pickled values look like base64."),
  );
}

function swap(...nodes) {
  const key = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.key : null;
  view.replaceChildren(...nodes);
  if (!key) return;
  for (const node of view.querySelectorAll("[data-key]")) {
    if (node.dataset.key === key) { node.focus(); return; }
  }
}

function message(title, text, isError) {
  const parts = [el("h1", { tabindex: "-1" }, title), el("p", isError ? { class: "alert", role: "alert" } : { class: "finding", role: "status" }, text)];
  if (location.hash.startsWith("#/workflows/")) parts.unshift(el("a", { class: "back", href: "#/", "data-key": "back" }, "All workflows"));
  view.replaceChildren(...parts);
}

function currentId() {
  const match = location.hash.match(/^#\/workflows\/(.+)$/);
  if (!match) return null;
  try { return decodeURIComponent(match[1]); } catch { return null; }
}

function stampNow() {
  stamp.textContent = `Updated ${new Date().toLocaleTimeString()}`;
}

async function load(id, ticket, state) {
  try {
    let text;
    let draw;
    if (id === null) {
      const data = await getJson("/api/workflows");
      text = JSON.stringify(data) + query.value + filter;
      draw = (problem) => renderList(data.workflows, problem);
    } else {
      const path = `/api/workflows/${encodeURIComponent(id)}`;
      const [workflow, steps] = await Promise.all([getJson(path), getJson(`${path}/steps`)]);
      text = JSON.stringify([workflow, steps]);
      draw = (problem) => renderDetail(workflow, steps.steps, problem);
    }
    if (ticket !== navigation) return;
    if (text !== state.text || state.problem) draw(null);
    state.text = text;
    state.draw = draw;
    state.problem = false;
    stampNow();
  } catch (error) {
    if (ticket !== navigation || state.problem === error.message) return;
    state.problem = error.message;
    if (state.draw && error.status !== 404) {
      state.draw(`${error.message} Showing the last data read.`);
    } else if (error.status === 404) {
      state.draw = null;
      state.text = null;
      message("Workflow not found", error.message, false);
    } else {
      message(id === null ? "Workflows" : "Workflow", error.message, true);
    }
  }
}

function schedule(id, ticket, state) {
  clearTimeout(timer);
  timer = setTimeout(async () => {
    if (ticket !== navigation) return;
    if (!paused && !document.hidden) await load(id, ticket, state);
    if (ticket === navigation) schedule(id, ticket, state);
  }, REFRESH_MS);
}

async function route() {
  navigation += 1;
  const ticket = navigation;
  const id = currentId();
  const state = { text: null, draw: null, problem: false };
  shown = null;
  clearTimeout(timer);
  message(id === null ? "Workflows" : "Workflow", "Loading…", false);
  await load(id, ticket, state);
  if (ticket !== navigation) return;
  const heading = view.querySelector("h1");
  if (heading && moveFocus) heading.focus();
  moveFocus = true;
  schedule(id, ticket, state);
}

let moveFocus = false;
pauseButton.addEventListener("click", () => {
  paused = !paused;
  pauseButton.setAttribute("aria-pressed", String(paused));
  pauseButton.textContent = paused ? "Paused" : "Pause";
});
query.addEventListener("input", () => {
  if (shown) renderList(shown.rows, shown.problem);
});
