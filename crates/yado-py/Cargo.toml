[package]
name = "yado-py"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
yado-core = { path = "../yado-core" }
log = "0.4"
pyo3 = { version = "0.30", features = ["multiple-pymethods"] }
pyo3-async-runtimes = { version = "0.30", features = ["tokio-runtime"] }
pyo3-log = "0.13"
tokio = { version = "1", features = ["time"] }
