[package]
name = "dbos-mysql-py"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
dbos-mysql-core = { path = "../dbos-mysql-core" }
log = "0.4"
pyo3 = "0.30"
pyo3-async-runtimes = { version = "0.30", features = ["tokio-runtime"] }
pyo3-log = "0.13"
