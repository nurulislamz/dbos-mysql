[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "dbos-mysql"
version = "0.0.1"
description = "Unofficial durable workflows for Python on MySQL and SQLite"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14,<3.15"
dependencies = ["pydantic>=2.9,<3"]

[dependency-groups]
dev = ["maturin>=1.16,<2", "pymysql>=1.1", "pytest>=8", "pytest-asyncio>=1", "pytest-timeout>=2"]

[tool.maturin]
manifest-path = "crates/dbos-mysql-py/Cargo.toml"
python-source = "python"
module-name = "dbos_mysql._native"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
timeout = 60
addopts = "-m 'not chaos'"
markers = ["chaos: kills real processes and restarts the database; slow"]
