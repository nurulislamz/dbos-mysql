[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "rust-dwos"
version = "0.0.1"
description = "Durable workflows on Postgres, MySQL and SQLite. Rust decides. Python runs the function."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = ["maturin>=1.16,<2", "pymysql>=1.1", "pytest>=8", "pytest-asyncio>=1", "pytest-timeout>=2"]

[tool.maturin]
manifest-path = "crates/dwos-py/Cargo.toml"
python-source = "python"
module-name = "rust_dwos._native"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
timeout = 60
addopts = "-m 'not chaos'"
markers = ["chaos: kills real processes and restarts the database; slow"]
