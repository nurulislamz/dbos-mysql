services:
  mysql:
    image: docker.io/library/mysql:8.4
    mem_limit: 4g
    environment:
      MYSQL_ROOT_PASSWORD: dbos-test-root
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: dbos_test
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      # Parallel Rust and Python suites need far more than the default 151.
      - --max-connections=2000
    ports:
      - "127.0.0.1:${DBOS_TEST_DB_PORT:-13307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
  postgres:
    image: docker.io/library/postgres:17
    mem_limit: 2g
    shm_size: 512m
    command: ["postgres", "-c", "max_connections=1000"]
    environment:
      POSTGRES_PASSWORD: dbos-test-root
      POSTGRES_DB: dbos_test
    ports:
      - "127.0.0.1:${DBOS_TEST_PG_PORT:-13309}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s
